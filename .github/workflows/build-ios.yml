name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build NetworkAnalyzer iOS App
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NetworkAnalyzer App
        run: |
          cd ios
          xcodebuild clean build \
            -project NetworkAnalyzer.xcodeproj \
            -scheme NetworkAnalyzer \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build"

      - name: Package to IPA
        run: |
          cd ios
          mkdir -p package/Payload
          cp -r build/Release-iphoneos/NetworkAnalyzer.app package/Payload/
          cd package
          zip -r ../NetworkAnalyzer.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAnalyzer-iOS-IPA
          path: ios/NetworkAnalyzer.ipa
          retention-days: 14

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.0
          name: "Network Analyzer iOS v1.0.0 (IPA)"
          files: ios/NetworkAnalyzer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
