name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build NetworkAnalyzer iOS App
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build NetworkAnalyzer App
        run: |
          cd ios
          xcodebuild clean build \
            -project NetworkAnalyzer.xcodeproj \
            -scheme NetworkAnalyzer \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ github.workspace }}/build" > ../build.log 2>&1 || (cat ../build.log | tail -n 120 && exit 1)

      - name: Package to IPA
        run: |
          echo "Checking build directory..."
          ls -la "${{ github.workspace }}/build/Release-iphoneos"
          ls -la "${{ github.workspace }}/build/Release-iphoneos/NetworkAnalyzer.app"
          if [ ! -f "${{ github.workspace }}/build/Release-iphoneos/NetworkAnalyzer.app/NetworkAnalyzer" ]; then
            echo "Error: NetworkAnalyzer executable binary not found!"
            exit 1
          fi
          mkdir -p package/Payload
          cp -r "${{ github.workspace }}/build/Release-iphoneos/NetworkAnalyzer.app" package/Payload/
          cd package
          zip -r "${{ github.workspace }}/NetworkAnalyzer.ipa" Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAnalyzer-iOS-IPA
          path: NetworkAnalyzer.ipa
          retention-days: 14

      - name: Release IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.1
          name: "Network Analyzer iOS v1.0.1 (IPA)"
          files: NetworkAnalyzer.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp build.log failure.log 2>/dev/null || true
          git add failure.log
          git commit -m "ci: save build failure log" || true
          git push origin build-log --force || true
